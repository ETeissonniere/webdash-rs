[package]
name = "webdash-rs"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "webdash-rs"
required-features = ["ssr"]

[features]
default = ["ssr"]
ssr = ["leptos/ssr", "dep:axum", "dep:regex", "dep:reqwest", "dep:serde_json", "dep:tokio", "dep:url", "dep:tower-http"]
hydrate = ["leptos/hydrate"]

[dependencies]
axum = { version = "0.8", optional = true }
base64 = "0.22"
leptos = { version = "=0.8.20", default-features = false, features = ["islands"] }
regex = { version = "1", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync"], optional = true }
url = { version = "2", optional = true }
wasm-bindgen = "=0.2.128"
web-sys = { version = "=0.3.105", features = ["Document", "Element", "EventTarget", "HtmlElement", "HtmlImageElement", "HtmlInputElement", "KeyboardEvent", "Location", "Node", "NodeList", "Window"] }
tower-http = { version = "0.6", features = ["fs"], optional = true }

[package.metadata.leptos]
output-name = "webdash-rs"
site-root = "target/site"
site-pkg-dir = "pkg"
style-file = "style.css"
assets-dir = "assets"
site-addr = "0.0.0.0:3000"
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
