[workspace]
members = ["services/*", "crates/*"]
resolver = "2"

[workspace.dependencies]
axum = "0.8"
base64 = "0.22"
leptos = { version = "=0.8.20", default-features = false, features = ["islands"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync"] }
url = "2"
wasm-bindgen = "=0.2.128"
web-sys = { version = "=0.3.105", features = ["Document", "Element", "EventTarget", "HtmlElement", "HtmlImageElement", "HtmlInputElement", "KeyboardEvent", "Location", "Node", "NodeList", "Window"] }
tower-http = { version = "0.6", features = ["fs"] }

[[workspace.metadata.leptos]]
name = "dashboard"
bin-package = "dashboard"
lib-package = "home-ui"
site-root = "target/site"
site-pkg-dir = "pkg"
style-file = "crates/home-ui/style.css"
assets-dir = "services/dashboard/assets"
site-addr = "0.0.0.0:3000"
bin-features = ["ssr"]
lib-features = ["hydrate"]
