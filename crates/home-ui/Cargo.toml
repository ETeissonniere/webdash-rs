[package]
name = "home-ui"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["ssr"]
ssr = ["leptos/ssr", "dep:base64", "quick-search/ssr"]
hydrate = ["leptos/hydrate", "quick-search/hydrate", "dep:wasm-bindgen"]

[dependencies]
base64 = { workspace = true, optional = true }
leptos.workspace = true
quick-search = { path = "../quick-search" }
serde.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true, optional = true }
